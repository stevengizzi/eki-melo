<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EKI GREETINGS — Birthday Party Jingles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  --bg-deep: #0d0221;
  --bg-card: #1a0f3a;
  --bg-card-light: #2a1959;
  --text: #fffefb;
  --text-dim: #b8b3d4;
  --accent-red: #ff3864;
  --accent-blue: #29adff;
  --accent-yellow: #fee761;
  --accent-green: #00e436;
  --accent-pink: #ff77a8;
  --accent-purple: #c77dff;
  --border: #4a3a8a;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg-deep); }

body {
  font-family: 'VT323', monospace;
  background: var(--bg-deep);
  background-image:
    radial-gradient(circle at 18% 25%, rgba(255, 56, 100, 0.10) 0%, transparent 45%),
    radial-gradient(circle at 82% 75%, rgba(41, 173, 255, 0.10) 0%, transparent 45%),
    radial-gradient(circle at 50% 100%, rgba(255, 119, 168, 0.07) 0%, transparent 50%);
  background-attachment: fixed;
  color: var(--text);
  min-height: 100vh;
  font-size: 20px;
  line-height: 1.45;
  padding: 28px 20px;
  position: relative;
  overflow-x: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;
  background: repeating-linear-gradient(
    0deg,
    rgba(0, 0, 0, 0.07),
    rgba(0, 0, 0, 0.07) 1px,
    transparent 1px,
    transparent 3px
  );
  pointer-events: none;
  z-index: 1000;
}

.container { max-width: 820px; margin: 0 auto; position: relative; }

header { text-align: center; padding: 32px 8px 28px; }

h1 {
  font-family: 'Press Start 2P', monospace;
  font-size: 30px;
  color: var(--accent-yellow);
  text-shadow:
    3px 3px 0 var(--accent-red),
    6px 6px 0 rgba(255, 56, 100, 0.3);
  line-height: 1.5;
  margin-bottom: 18px;
  letter-spacing: 2px;
}

.subtitle {
  color: var(--text-dim);
  font-size: 22px;
  max-width: 560px;
  margin: 0 auto;
}

.subtitle .hl { color: var(--accent-pink); }

.heart { display: inline-block; animation: bounce 1.5s infinite; color: var(--accent-red); }
@keyframes bounce {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-3px) scale(1.1); }
}

.backup-bar {
  display: flex;
  gap: 8px;
  justify-content: center;
  margin: 16px auto 24px;
  flex-wrap: wrap;
}

.pixel-card {
  background: var(--bg-card);
  padding: 28px 24px;
  margin-bottom: 22px;
  position: relative;
  box-shadow:
    0 0 0 3px var(--border),
    inset 2px 2px 0 0 rgba(255,255,255,0.04),
    inset -2px -2px 0 0 rgba(0,0,0,0.4),
    8px 8px 0 0 rgba(0,0,0,0.5);
}

.form-section h2 {
  font-family: 'Press Start 2P', monospace;
  font-size: 13px;
  color: var(--accent-blue);
  margin-bottom: 18px;
  letter-spacing: 1.5px;
}

label {
  display: block;
  font-family: 'Press Start 2P', monospace;
  font-size: 9px;
  color: var(--accent-yellow);
  margin: 16px 0 8px;
  letter-spacing: 1.5px;
}

.form-section > label:first-of-type { margin-top: 0; }

input[type="text"], textarea {
  width: 100%;
  background: var(--bg-deep);
  border: 2px solid var(--border);
  color: var(--text);
  font-family: 'VT323', monospace;
  font-size: 20px;
  padding: 10px 12px;
  outline: none;
  transition: border-color 0.15s, background 0.15s;
}

input[type="text"]:focus, textarea:focus {
  border-color: var(--accent-pink);
  background: #18093a;
}

textarea { min-height: 88px; resize: vertical; }

.btn {
  font-family: 'Press Start 2P', monospace;
  font-size: 12px;
  padding: 14px 20px;
  background: var(--accent-red);
  color: var(--text);
  border: none;
  cursor: pointer;
  letter-spacing: 1.5px;
  transition: transform 0.08s, box-shadow 0.08s;
  box-shadow: 4px 4px 0 #000;
  margin-top: 16px;
  text-transform: uppercase;
}

.btn:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 5px 5px 0 #000; }
.btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000; }
.btn:disabled { background: var(--border); cursor: wait; color: var(--text-dim); }

.btn-play { background: var(--accent-green); color: #000; }
.btn-secondary { background: var(--accent-blue); color: #000; }
.btn-tertiary { background: var(--accent-purple); color: #000; }
.btn-danger { background: var(--accent-red); }
.btn-ghost { background: transparent; box-shadow: 0 0 0 2px var(--border); color: var(--text-dim); }
.btn-ghost:hover:not(:disabled) { box-shadow: 0 0 0 2px var(--accent-pink); color: var(--accent-pink); transform: none; }
.btn-ghost:active:not(:disabled) { transform: none; box-shadow: 0 0 0 2px var(--accent-pink); }

.btn-small {
  font-size: 9px;
  padding: 9px 12px;
  margin-top: 0;
  box-shadow: 3px 3px 0 #000;
}
.btn-small:hover:not(:disabled) { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 #000; }
.btn-small:active:not(:disabled) { transform: translate(1px, 1px); box-shadow: 2px 2px 0 #000; }
.btn-small.btn-ghost { box-shadow: 0 0 0 2px var(--border); }
.btn-small.btn-ghost:hover:not(:disabled) { box-shadow: 0 0 0 2px var(--accent-pink); }

.section-heading {
  font-family: 'Press Start 2P', monospace;
  font-size: 12px;
  color: var(--accent-pink);
  margin: 32px 0 18px;
  letter-spacing: 1.5px;
}

.guest-card {
  background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-card-light) 100%);
  padding: 22px;
  margin-bottom: 18px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  position: relative;
  box-shadow:
    0 0 0 3px var(--border),
    inset 2px 2px 0 0 rgba(255,255,255,0.04),
    8px 8px 0 0 rgba(0,0,0,0.4);
  transition: box-shadow 0.2s;
}

.guest-card.playing { animation: glow-pulse 1.4s ease-in-out infinite; }

@keyframes glow-pulse {
  0%, 100% { box-shadow: 0 0 0 3px var(--accent-green), inset 2px 2px 0 0 rgba(255,255,255,0.04), 0 0 18px rgba(0, 228, 54, 0.35), 8px 8px 0 0 rgba(0,0,0,0.4); }
  50% { box-shadow: 0 0 0 3px var(--accent-green), inset 2px 2px 0 0 rgba(255,255,255,0.04), 0 0 32px rgba(0, 228, 54, 0.7), 8px 8px 0 0 rgba(0,0,0,0.4); }
}

.guest-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 18px;
  flex-wrap: wrap;
}

.guest-left {
  display: flex;
  gap: 18px;
  align-items: flex-start;
  flex: 1;
  min-width: 0;
}

.guest-info { flex: 1; min-width: 0; }

.avatar-wrap {
  width: 96px;
  height: 96px;        /* back to square — 24×24 sprite at 4x = 96×96, perfect fit */
  background: #000;
  border: 2px solid var(--border);
  position: relative;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

.avatar-wrap canvas {
  /* width/height set explicitly in renderAvatar() from each sprite's stored */
  /* dimensions, so current 24×24 sprites fill the square frame while legacy */
  /* 32×48 portrait sprites still render (scaled down, aspect-preserved). */
  image-rendering: pixelated;
  image-rendering: -moz-crisp-edges;
  image-rendering: crisp-edges;
}

.avatar-wrap.loading::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(45deg, transparent 40%, rgba(0,228,54,0.3) 50%, transparent 60%);
  background-size: 200% 200%;
  animation: shimmer 1.4s linear infinite;
}

@keyframes shimmer {
  0% { background-position: 200% 200%; }
  100% { background-position: -100% -100%; }
}

.avatar-controls {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 4px;
  margin-top: 6px;
}

.avatar-controls button {
  background: transparent;
  color: var(--text-dim);
  border: 1px solid var(--border);
  padding: 1px 6px;
  font-family: 'Press Start 2P', monospace;
  font-size: 8px;
  cursor: pointer;
}

.avatar-controls button:hover:not(:disabled) { color: var(--accent-pink); border-color: var(--accent-pink); }
.avatar-controls button:disabled { opacity: 0.3; cursor: not-allowed; }
.avatar-controls span { font-family: 'Press Start 2P', monospace; font-size: 8px; color: var(--text-dim); }

.guest-name {
  font-family: 'Press Start 2P', monospace;
  font-size: 15px;
  color: var(--accent-yellow);
  margin-bottom: 6px;
  letter-spacing: 1px;
  word-break: break-word;
  line-height: 1.4;
}

.guest-theme { color: var(--accent-pink); font-size: 22px; font-style: italic; }
.guest-meta { color: var(--text-dim); font-size: 17px; margin-top: 4px; letter-spacing: 0.5px; }
.guest-desc { color: var(--text-dim); font-size: 17px; margin-top: 6px; font-style: italic; opacity: 0.75; }

.guest-actions { display: flex; gap: 8px; flex-shrink: 0; flex-wrap: wrap; }

.action-row {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
  align-items: center;
}

.version-controls {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'Press Start 2P', monospace;
  font-size: 9px;
  color: var(--text-dim);
  letter-spacing: 1px;
}

.version-controls button {
  background: transparent;
  border: 2px solid var(--border);
  color: var(--text-dim);
  width: 24px;
  height: 24px;
  font-family: 'Press Start 2P', monospace;
  font-size: 10px;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
}

.version-controls button:hover:not(:disabled) { border-color: var(--accent-pink); color: var(--accent-pink); }
.version-controls button:disabled { opacity: 0.25; cursor: not-allowed; }

.piano-roll {
  background: #000;
  border: 2px solid var(--border);
  height: 96px;
  position: relative;
  overflow: hidden;
}

.note-block {
  position: absolute;
  border: 1px solid rgba(0,0,0,0.5);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15);
}

.note-block.lead    { background: var(--accent-green); }
.note-block.harmony { background: var(--accent-blue); }
.note-block.bass    { background: var(--accent-yellow); }

.section-marker {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 1px;
  background: rgba(255,119,168,0.25);
  pointer-events: none;
}

.section-label {
  position: absolute;
  top: 2px;
  font-family: 'Press Start 2P', monospace;
  font-size: 7px;
  color: rgba(255,119,168,0.55);
  letter-spacing: 1px;
  pointer-events: none;
  padding-left: 3px;
}

.piano-roll-legend {
  position: absolute;
  bottom: 4px;
  right: 6px;
  font-size: 12px;
  color: var(--text-dim);
  display: flex;
  gap: 10px;
  pointer-events: none;
  font-family: 'VT323', monospace;
}
.piano-roll-legend span::before { content: '■ '; display: inline; }
.piano-roll-legend .lead-l { color: var(--accent-green); }
.piano-roll-legend .harm-l { color: var(--accent-blue); }
.piano-roll-legend .bass-l { color: var(--accent-yellow); }

.playhead {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--accent-red);
  box-shadow: 0 0 6px var(--accent-red), 0 0 12px var(--accent-red);
  pointer-events: none;
  left: 0;
  display: none;
}
.playhead.active { display: block; }

.empty-state { text-align: center; padding: 40px 24px; color: var(--text-dim); }
.empty-state-icon { font-family: 'Press Start 2P', monospace; font-size: 24px; margin-bottom: 16px; color: var(--accent-pink); letter-spacing: 4px; }
.empty-state p { font-size: 19px; }

@keyframes dots {
  0%, 20% { content: '.'; }
  40% { content: '..'; }
  60%, 100% { content: '...'; }
}
.loading::after { content: '.'; animation: dots 1.2s infinite; }

.error {
  background: rgba(255, 56, 100, 0.18);
  border-left: 4px solid var(--accent-red);
  color: var(--accent-red);
  padding: 12px;
  margin-top: 14px;
  font-size: 18px;
}

.toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--accent-green);
  color: #000;
  font-family: 'Press Start 2P', monospace;
  font-size: 11px;
  padding: 14px 20px;
  z-index: 2000;
  letter-spacing: 1.5px;
  box-shadow: 4px 4px 0 #000;
  animation: toast-in 0.3s ease-out;
}

@keyframes toast-in {
  from { transform: translate(-50%, 40px); opacity: 0; }
  to { transform: translate(-50%, 0); opacity: 1; }
}

footer { text-align: center; color: var(--text-dim); font-size: 16px; padding: 40px 16px 20px; }
footer .tag { font-family: 'Press Start 2P', monospace; font-size: 8px; letter-spacing: 2px; color: var(--border); margin-bottom: 8px; }

.coin {
  display: inline-block;
  width: 12px;
  height: 12px;
  background: var(--accent-yellow);
  box-shadow:
    -2px 0 0 var(--accent-yellow),
    2px 0 0 var(--accent-yellow),
    0 -2px 0 var(--accent-yellow),
    0 2px 0 var(--accent-yellow),
    inset -1px -1px 0 rgba(0,0,0,0.3);
  margin: 0 2px;
  vertical-align: middle;
}

@media (max-width: 600px) {
  body { padding: 16px 12px; font-size: 18px; }
  h1 { font-size: 18px; letter-spacing: 1px; }
  .subtitle { font-size: 20px; }
  .pixel-card { padding: 20px 16px; }
  .guest-card { padding: 18px 14px; }
  .btn { font-size: 11px; padding: 12px 16px; }
  .btn-small { font-size: 9px; padding: 8px 10px; }
  .guest-name { font-size: 13px; }
  .guest-left { gap: 12px; }
  .avatar-wrap { width: 72px; height: 72px; }   /* back to square */
  .guest-header { flex-direction: column; gap: 12px; }
  .guest-actions { width: 100%; }
  .action-row { flex-direction: column; align-items: stretch; }
  .action-row > div { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; }
}
</style>

<body>

<div class="container">
  <header>
    <h1>EKI GREETINGS</h1>
    <p class="subtitle">A <span class="hl">birthday-party arrival theme</span> generator <span class="heart">♥</span> Inspired by Japanese train-station <em>eki melodies</em>, rendered NES-style with pixel avatars.</p>
    <div class="backup-bar">
      <button class="btn btn-ghost btn-small" id="export-btn">↓ EXPORT BACKUP</button>
      <button class="btn btn-ghost btn-small" id="import-btn">↑ IMPORT BACKUP</button>
      <input type="file" id="import-file" accept="application/json" style="display:none">
    </div>
  </header>

  <div class="pixel-card form-section">
    <h2>＋ ADD A GUEST</h2>
    <label for="guest-name">GUEST NAME</label>
    <input type="text" id="guest-name" placeholder="e.g. Patrick" maxlength="60" autocomplete="off">
    <label for="guest-desc">PERSONALITY / VIBE</label>
    <textarea id="guest-desc" placeholder="e.g. Mellow and dreamy, loves shoegaze and houseplants. Walks slowly, talks even slower. Always brings the perfect record." maxlength="500"></textarea>
    <button class="btn" id="generate-btn">► COMPOSE THEME &amp; AVATAR</button>
    <div id="form-error" class="error" style="display:none"></div>
  </div>

  <div id="guest-list"></div>

  <footer>
    <p class="tag">▶ PRESS START TO CONTINUE ◀</p>
    <p>Multi-section forms · three voices · animated pixel avatars <span class="coin"></span> Made for a real birthday.</p>
  </footer>
</div>

<script>
/* =================================================================
   CHIPTUNE SYNTHESIS — works on AudioContext OR OfflineAudioContext
   ================================================================= */
function makePulseWave(ctx, duty) {
  const n = 32;
  const real = new Float32Array(n);
  const imag = new Float32Array(n);
  for (let i = 1; i < n; i++) {
    imag[i] = (2 / (i * Math.PI)) * Math.sin(i * Math.PI * duty);
  }
  return ctx.createPeriodicWave(real, imag);
}

const NOTE_MAP = { C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11 };

function noteToFreq(note) {
  if (!note || note === 'rest' || note === 'r') return 0;
  const m = String(note).match(/^([A-G][#b]?)(-?\d+)$/);
  if (!m) return 0;
  const semis = NOTE_MAP[m[1]] + (parseInt(m[2]) - 4) * 12;
  return 440 * Math.pow(2, (semis - 9) / 12);
}

function scheduleNote(ctx, dest, freq, startTime, duration, waveform, volume, periodicWaves) {
  if (freq === 0 || duration <= 0.01) return null;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  if (waveform === 'pulse50') osc.setPeriodicWave(periodicWaves.p50);
  else if (waveform === 'pulse25') osc.setPeriodicWave(periodicWaves.p25);
  else osc.type = waveform;
  osc.frequency.setValueAtTime(freq, startTime);
  const attack = 0.003;
  const decay = 0.04;
  const sustain = volume * 0.72;
  const release = Math.min(0.08, duration * 0.3);
  const sustainEnd = Math.max(startTime + attack + decay, startTime + duration - release);
  gain.gain.setValueAtTime(0, startTime);
  gain.gain.linearRampToValueAtTime(volume, startTime + attack);
  gain.gain.linearRampToValueAtTime(sustain, startTime + attack + decay);
  gain.gain.setValueAtTime(sustain, sustainEnd);
  gain.gain.linearRampToValueAtTime(0, startTime + duration);
  osc.connect(gain);
  gain.connect(dest);
  osc.start(startTime);
  osc.stop(startTime + duration + 0.02);
  return osc;
}

function scheduleJingle(ctx, dest, jingle, startTime, periodicWaves) {
  const beat = 60 / (jingle.tempo || 140);
  const oscs = [];
  let totalDur = 0;

  const playTrack = (track, waveform, volume) => {
    if (!Array.isArray(track)) return;
    let t = 0;
    for (const ev of track) {
      if (!Array.isArray(ev) || ev.length < 2) continue;
      const [note, beats] = ev;
      const dur = (Number(beats) || 0) * beat;
      const freq = noteToFreq(note);
      const osc = scheduleNote(ctx, dest, freq, startTime + t, dur * 0.94, waveform, volume, periodicWaves);
      if (osc) oscs.push(osc);
      t += dur;
    }
    if (t > totalDur) totalDur = t;
  };

  playTrack(jingle.lead,    'pulse50',  0.13);
  playTrack(jingle.harmony, 'pulse25',  0.085);
  playTrack(jingle.bass,    'triangle', 0.22);

  return { oscs, totalDur };
}

class LiveSynth {
  constructor() {
    this.ctx = null;
    this.activeOscs = [];
    this.currentId = null;
    this.onStart = null;
    this.onEnd = null;
    this._endTimer = null;
  }

  init() {
    if (!this.ctx) {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = this.ctx.createGain();
      this.master.gain.value = 0.65;
      this.master.connect(this.ctx.destination);
      this.pw = { p50: makePulseWave(this.ctx, 0.50), p25: makePulseWave(this.ctx, 0.25) };
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  }

  stop() {
    this.activeOscs.forEach(n => { try { n.stop(); } catch(e) {} });
    this.activeOscs = [];
    if (this._endTimer) { clearTimeout(this._endTimer); this._endTimer = null; }
    if (this.currentId && this.onEnd) this.onEnd(this.currentId);
    this.currentId = null;
  }

  play(jingle, id) {
    this.init();
    this.stop();
    const startTime = this.ctx.currentTime + 0.06;
    const { oscs, totalDur } = scheduleJingle(this.ctx, this.master, jingle, startTime, this.pw);
    this.activeOscs = oscs;
    this.currentId = id;
    if (this.onStart) this.onStart(id, totalDur);
    this._endTimer = setTimeout(() => {
      if (this.onEnd) this.onEnd(id);
      this.currentId = null;
    }, (totalDur + 0.25) * 1000);
  }
}

const synth = new LiveSynth();

/* =================================================================
   WAV RENDERING via OfflineAudioContext
   ================================================================= */
async function renderJingleToWav(jingle) {
  const sampleRate = 44100;
  const beat = 60 / (jingle.tempo || 140);
  const trackLens = ['lead', 'harmony', 'bass']
    .map(t => (jingle[t] || []).reduce((s, ev) => s + (Number(ev[1]) || 0), 0));
  const totalBeats = Math.max(...trackLens, 1);
  const durationSec = totalBeats * beat + 0.6;
  const offline = new OfflineAudioContext(2, Math.ceil(durationSec * sampleRate), sampleRate);
  const master = offline.createGain();
  master.gain.value = 0.65;
  master.connect(offline.destination);
  const pw = { p50: makePulseWave(offline, 0.50), p25: makePulseWave(offline, 0.25) };
  scheduleJingle(offline, master, jingle, 0.05, pw);
  const buffer = await offline.startRendering();
  return audioBufferToWavBlob(buffer);
}

function audioBufferToWavBlob(buffer) {
  const numChannels = buffer.numberOfChannels;
  const sampleRate = buffer.sampleRate;
  const samples = buffer.length;
  const bytesPerSample = 2;
  const dataLength = samples * numChannels * bytesPerSample;
  const ab = new ArrayBuffer(44 + dataLength);
  const view = new DataView(ab);

  const writeString = (offset, str) => {
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  };
  writeString(0, 'RIFF');
  view.setUint32(4, 36 + dataLength, true);
  writeString(8, 'WAVE');
  writeString(12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, numChannels, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * numChannels * bytesPerSample, true);
  view.setUint16(32, numChannels * bytesPerSample, true);
  view.setUint16(34, 16, true);
  writeString(36, 'data');
  view.setUint32(40, dataLength, true);

  const channels = [];
  for (let c = 0; c < numChannels; c++) channels.push(buffer.getChannelData(c));
  let offset = 44;
  for (let i = 0; i < samples; i++) {
    for (let c = 0; c < numChannels; c++) {
      let s = Math.max(-1, Math.min(1, channels[c][i]));
      view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      offset += 2;
    }
  }
  return new Blob([ab], { type: 'audio/wav' });
}

/* =================================================================
   ENVIRONMENT ADAPTER — same file runs in Claude.ai artifact OR browser

   The Claude.ai artifact runtime provides:
     - window.storage     (async per-user KV store)
     - automatic API key injection on calls to api.anthropic.com

   A regular browser (deployed via Cloudflare Pages) provides:
     - localStorage       (sync per-origin storage)
     - a serverless proxy at /api/generate (key held server-side)

   Feature-detecting on window.storage picks the right backend for both.
   ================================================================= */
const IS_ARTIFACT = (typeof window !== 'undefined') && (typeof window.storage !== 'undefined') && (window.storage !== null);

const API_ENDPOINT = IS_ARTIFACT
  ? "https://api.anthropic.com/v1/messages"
  : "/api/generate";

const storageBackend = IS_ARTIFACT
  ? {
      async get(key) {
        try {
          const r = await window.storage.get(key);
          return (r && r.value) ? r.value : null;
        } catch (e) { return null; }
      },
      async set(key, value) {
        await window.storage.set(key, value);
      }
    }
  : {
      async get(key) {
        try { return localStorage.getItem(key); }
        catch (e) { return null; }
      },
      async set(key, value) {
        try { localStorage.setItem(key, value); }
        catch (e) { console.error('localStorage.setItem failed', e); }
      }
    };

/* =================================================================
   STORAGE (v1 schema preserved, migrates on read — same key)
   ================================================================= */
const STORAGE_KEY = 'eki_guests_v1';
let guests = [];

function migrateGuest(g) {
  if (g.jingles && Array.isArray(g.jingles)) {
    return {
      id: g.id,
      name: g.name,
      description: g.description,
      jingles: g.jingles,
      currentJingleIndex: Math.min(g.currentJingleIndex || 0, g.jingles.length - 1),
      avatars: Array.isArray(g.avatars) ? g.avatars : [],
      currentAvatarIndex: g.currentAvatarIndex || 0
    };
  }
  // Old schema { jingle: {...} } — convert to versions array, preserving data
  const jingles = g.jingle ? [{ ...g.jingle, createdAt: Date.now() }] : [];
  return {
    id: g.id,
    name: g.name,
    description: g.description,
    jingles,
    currentJingleIndex: 0,
    avatars: [],
    currentAvatarIndex: 0
  };
}

async function loadGuests() {
  try {
    const value = await storageBackend.get(STORAGE_KEY);
    if (value) {
      const raw = JSON.parse(value);
      const needsMigration = raw.some(g => !g.jingles);
      guests = raw.map(migrateGuest);
      if (needsMigration) await saveGuests();
    }
  } catch (e) {
    guests = [];
  }
  render();
}

async function saveGuests() {
  try {
    await storageBackend.set(STORAGE_KEY, JSON.stringify(guests));
  } catch (e) {
    console.error('Save failed', e);
  }
}

/* =================================================================
   API: JINGLE GENERATION (longer, with musical form)
   ================================================================= */
async function generateJingle(name, description) {
  const system = `You are composing extended 8-bit chiptune themes in the style of Japanese train-station "eki melodies" combined with NES-era game music. You compose a personalized arrival theme for a party guest with proper musical form.

THREE TRACKS:
- LEAD: square-wave melody, primary thematic content (range C4–C6)
- HARMONY: counter-line, parallel intervals, or sparse harmony (range C4–B5). MAY be [] for sections where unison fits.
- BASS: triangle-wave bass, mostly roots and fifths with passing tones (range C2–C4)

FORM & LENGTH:
- Total: 32–56 beats (~14–24 seconds at typical tempos)
- Tempo 110–170 BPM, 4/4 time
- Use a clear multi-section form. Good choices:
  * AABA (jazz standard — A, A, contrasting B "bridge", A reprise)
  * ABA' (classical — theme, contrast, varied return)
  * ABCA (theme, departure, development, return)
- Each section 8–14 beats
- Sections must be musically distinct — change at least 2 of: mode, register, rhythmic density, melodic contour, voice texture

MOTIVIC DEVELOPMENT (crucial — this is what makes it memorable):
- Build the A section from 1–2 short motifs (3–5 notes each)
- In B/C sections or development, TRANSFORM the motifs: transpose, invert, fragment, augment (slow down), diminute (speed up), ornament, sequence
- Reprise should clearly recall A — exact, varied, or ornamented
- End with V→I or IV→I cadence; melody resolves to scale degree 1 (or 3/5 for an open feel)

TEXTURE / ORCHESTRATION across sections:
- Vary which voice carries the lead melody (voice exchange) — e.g., harmony takes the melody in B
- Harmony can drop out for thinner texture
- Bass might walk under busy lead, or hold a pedal point
- Use rhythmic variety: mix sixteenths, eighths, quarters, dotted values, occasional triplets via close eighths

CHOICES INSPIRED BY THE GUEST:
- Energy → tempo
- Warmth/mood → mode (major, natural/harmonic minor, dorian, mixolydian, lydian, phrygian)
- Pace → rhythmic density
- Vibe → melodic contour and intervallic character

Return ONLY valid JSON. No markdown, no commentary. Exact shape:
{
  "title": "short evocative theme name (2-5 words)",
  "tempo": 140,
  "key": "C major",
  "mood": "one word",
  "form": "AABA",
  "sections": [{"label":"A","start":0,"length":8},{"label":"A","start":8,"length":8},{"label":"B","start":16,"length":8},{"label":"A","start":24,"length":8}],
  "lead": [["C5", 0.5], ...],
  "harmony": [["E5", 0.5], ...],
  "bass": [["C3", 1], ...]
}

Note format: pitch with octave like "C4", "F#5", "Bb3", or literal "rest". Durations in beats: 1=quarter, 0.5=eighth, 0.25=sixteenth, 1.5=dotted quarter, 2=half. Track totals should align (they play simultaneously).`;

  const user = `Compose an arrival theme for this guest:

NAME: ${name}
DESCRIPTION: ${description}

Translate their personality into musical choices, then construct a piece with clear sections and motivic development so the piece feels composed, not just strung together. Make it instantly memorable.`;

  const response = await fetch(API_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 4000,
      system,
      messages: [{ role: "user", content: user }]
    })
  });

  if (!response.ok) {
    const errText = await response.text().catch(() => '');
    throw new Error(`API ${response.status}: ${errText.slice(0,120)}`);
  }

  const data = await response.json();
  const text = (data.content || [])
    .filter(b => b.type === 'text')
    .map(b => b.text || '')
    .join('').trim();

  let cleaned = text.replace(/^```json\s*/i, '').replace(/^```\s*/, '').replace(/```\s*$/, '').trim();
  let jingle;
  try {
    jingle = JSON.parse(cleaned);
  } catch (e) {
    const m = cleaned.match(/\{[\s\S]*\}/);
    if (!m) throw new Error('Could not parse jingle JSON');
    jingle = JSON.parse(m[0]);
  }

  if (!Array.isArray(jingle.lead) || jingle.lead.length === 0) throw new Error('Jingle missing lead melody');
  jingle.harmony = Array.isArray(jingle.harmony) ? jingle.harmony : [];
  jingle.bass    = Array.isArray(jingle.bass) ? jingle.bass : [];
  jingle.tempo   = Number(jingle.tempo) || 140;
  jingle.title   = String(jingle.title || 'untitled theme');
  jingle.key     = String(jingle.key   || '');
  jingle.mood    = String(jingle.mood  || '');
  jingle.form    = String(jingle.form  || '');
  jingle.sections = Array.isArray(jingle.sections) ? jingle.sections : [];
  jingle.createdAt = Date.now();
  return jingle;
}

/* =================================================================
   API: AVATAR GENERATION (24x24 pixel sprite, 2-frame loop)
   ================================================================= */
async function generateAvatar(name, description) {
  const system = `You design 16-bit style pixel art character sprites for a party "select character" screen. Each sprite captures a guest as an iconic anthropomorphic character — the kind of figure you'd see on a retro RPG class-select screen.

OUTPUT: JSON ONLY, no prose before or after. The JSON has reasoning fields FIRST (archetype, hooks, animation_concept) followed by sprite data. Filling out those reasoning fields IS your design step — commit to an archetype before placing pixels.

JSON SHAPE:
{
  "archetype": "Forest Ranger",
  "hooks": ["green hooded cloak", "longbow over shoulder", "small bird on shoulder"],
  "animation_concept": "bird turns its head and blinks",
  "palette": ["transparent", "#1d2b53", "#3e6e4a", "#6fa86d", "#d4a06b", "#ffccaa", "#ff004d", "#ffffff"],
  "frames": [
    ["000000000000000000000000", "...24 rows of 24 hex chars total..."],
    ["...frame 2..."]
  ],
  "fps": 3
}

ARCHETYPE — pick or invent a character class that captures this guest. Fantasy and sci-fi both fair game:
Ranger, Naturalist, Bard, Sage, Scholar, Cartographer, Astronomer, Apothecary, Tinkerer, Artificer, Inventor, Mechanic, Pilot, Engineer, Drifter, Wanderer, Navigator, Beastmaster, Falconer, Chronomancer, Cyber-monk, Stargazer, Alchemist, Lorekeeper, Archivist, Strategist, Field Medic, Botanist.

Lean hard into the archetype where the personality has a clear hook (forest-lover → Ranger or Naturalist; tinkerer → Artificer or Inventor; observer / INTJ → Scholar or Strategist).

HOOKS — 2-3 concrete visual elements that make this character read instantly. A tool, an accessory, a color signature, a companion creature, a distinctive hat.

ANIMATION CONCEPT — a small moment of delight in the idle loop (2 frames at 3-4 fps). Examples: a bird on the shoulder turns its head, a wrench rotates a quarter-turn, a staff-tip twinkles, glasses glint, a small gear at the belt clicks forward, a cloak edge sways. Keep it small — 24×24 doesn't have room for big motion. ONE small thing moving is enough.

==================================================================
DRAWING RULES — THIS IS THE PART THAT MATTERS MOST. READ CAREFULLY.
==================================================================

You are drawing ONE CHARACTER, not a collection of accessories. The character is a single connected figure that fills most of the canvas vertically.

Draw in this order, mentally:
1. FIRST — the body silhouette. Head connected to neck connected to torso connected to legs, as ONE continuous outlined shape. This is your foundation. The head sits roughly in the top third, torso in the middle, legs in the bottom third, ALL TOUCHING. The figure is roughly 12-18 pixels tall total and 8-14 pixels wide. There must be no gap between body parts.
2. THEN — clothe and color the silhouette. Cloak over the shoulders, robes covering the torso, boots on the legs, hat on the head.
3. THEN — add the signature hooks ON the figure. Tool in the figure's hand. Companion creature ON the figure's shoulder or hand. Belt around the figure's waist. Hat on the figure's head.

THE HOOKS ARE NEVER STANDALONE OBJECTS. They are always attached to the body. If you find yourself drawing a tool floating in space, or a companion creature with no character holding it, or a hood with empty space where the head should be — STOP and add the body underneath. A character with the body present and the hook implied is far better than a hook with no character.

The figure should fill at least 60% of the canvas height. Empty space at the top and bottom is fine — empty space IN THE MIDDLE OF THE FIGURE (between head and torso, or between torso and legs) is a bug.

SPRITE FORMAT — 24 wide × 24 tall:
- Each frame is exactly 24 rows, each row exactly 24 characters.
- Each character is a single hex digit (0-9, a-f) representing the palette index.
- Palette: 4-10 colors. Index 0 must be the string "transparent". Indices 1+ are hex like "#ff3864".
- Background pixels are index 0 (transparent).
- Forward-facing standing pose, character centered horizontally.
- 2 frames for idle animation. Frame 2 differs from frame 1 by 2-8 pixels — visible motion of ONE element (the companion, the tool, a blink) while the rest of the body stays still.

DESIGN RULES:
- 1-pixel outline in the darkest palette color so the silhouette reads against a dark background.
- Chunky, readable shapes. No single-pixel noise.
- ALWAYS anthropomorphic (clear head-torso-legs structure). The character can be human, humanoid, or anthropomorphic animal/creature — but always with that connected body structure.
- ALWAYS charming, NEVER scary or monstrous. No fangs, no skulls, no menace.

REMEMBER: ONE CONNECTED FIGURE. Body first, hooks second. If the body isn't there, the avatar fails no matter how nice the hooks look.`;

  const user = `Design the avatar for this guest.

NAME: ${name}
DESCRIPTION: ${description}`;

  const response = await fetch(API_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 4000,
      system,
      messages: [{ role: "user", content: user }]
    })
  });

  if (!response.ok) {
    const errText = await response.text().catch(() => '');
    throw new Error(`Avatar API ${response.status}: ${errText.slice(0,120)}`);
  }

  const data = await response.json();
  const text = (data.content || [])
    .filter(b => b.type === 'text')
    .map(b => b.text || '')
    .join('').trim();

  let cleaned = text.replace(/```json/gi, '').replace(/```/g, '').trim();
  let avatar;
  try { avatar = JSON.parse(cleaned); }
  catch (e) {
    const m = cleaned.match(/\{[\s\S]*\}/);
    if (!m) throw new Error('Could not parse avatar JSON');
    avatar = JSON.parse(m[0]);
  }

  if (!Array.isArray(avatar.palette)) throw new Error('Avatar missing palette');
  if (!Array.isArray(avatar.frames) || avatar.frames.length === 0) throw new Error('Avatar missing frames');

  // Normalize: pad/truncate each row to 24 chars, ensure 24 rows per frame.
  const ROW_PAD = '000000000000000000000000'; // 24 zeros
  avatar.frames = avatar.frames.map(frame => {
    if (!Array.isArray(frame)) return Array(24).fill(ROW_PAD);
    const rows = frame.slice(0, 24).map(r => {
      const str = String(r).toLowerCase();
      return (str + ROW_PAD).slice(0, 24);
    });
    while (rows.length < 24) rows.push(ROW_PAD);
    return rows;
  });
  avatar.fps = Number(avatar.fps) || 3;
  avatar.width = 24;
  avatar.height = 24;
  avatar.createdAt = Date.now();
  return avatar;
}

/* =================================================================
   AVATAR RENDERING (canvas with animated frames)
   ================================================================= */
const avatarAnimations = new Map();

function renderAvatar(canvas, avatar) {
  if (!avatar) return;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  const W = avatar.width || 24, H = avatar.height || 24;
  canvas.width = W;
  canvas.height = H;

  // Pick the largest integer scale that fits the wrap, preserving aspect.
  // Wrap is 96×144 on desktop, 64×96 on mobile — read it from parent.
  const wrap = canvas.parentElement;
  if (wrap) {
    const wrapW = wrap.clientWidth || 96;
    const wrapH = wrap.clientHeight || 144;
    const scale = Math.max(1, Math.floor(Math.min(wrapW / W, wrapH / H)));
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
  }

  const drawFrame = (frameIdx) => {
    ctx.clearRect(0, 0, W, H);
    const frame = avatar.frames[frameIdx % avatar.frames.length];
    if (!frame) return;
    for (let y = 0; y < H; y++) {
      const row = frame[y] || '';
      for (let x = 0; x < W; x++) {
        const ch = row[x];
        if (!ch || ch === '0') continue;
        const idx = parseInt(ch, 16);
        if (isNaN(idx)) continue;
        const color = avatar.palette[idx];
        if (!color || color === 'transparent') continue;
        ctx.fillStyle = color;
        ctx.fillRect(x, y, 1, 1);
      }
    }
  };

  const existing = avatarAnimations.get(canvas);
  if (existing) cancelAnimationFrame(existing.raf);

  if (avatar.frames.length === 1) {
    drawFrame(0);
    return;
  }

  const fps = Math.max(1, Math.min(12, avatar.fps || 3));
  const frameDur = 1000 / fps;
  let lastSwitch = performance.now();
  let frameIdx = 0;
  drawFrame(0);

  const tick = (now) => {
    if (now - lastSwitch >= frameDur) {
      frameIdx = (frameIdx + 1) % avatar.frames.length;
      drawFrame(frameIdx);
      lastSwitch = now;
    }
    const raf = requestAnimationFrame(tick);
    avatarAnimations.set(canvas, { raf, frameIdx });
  };
  const raf = requestAnimationFrame(tick);
  avatarAnimations.set(canvas, { raf, frameIdx });
}

function mountAvatars() {
  document.querySelectorAll('canvas[data-avatar-guest]').forEach(c => {
    const guestId = c.dataset.avatarGuest;
    const guest = guests.find(g => g.id === guestId);
    if (!guest || !guest.avatars[guest.currentAvatarIndex]) return;
    renderAvatar(c, guest.avatars[guest.currentAvatarIndex]);
  });
}

/* =================================================================
   PIANO-ROLL RENDERING (with section markers)
   ================================================================= */
function renderPianoRoll(jingle) {
  const tempo = jingle.tempo || 140;
  const beat = 60 / tempo;
  const trackLens = ['lead', 'harmony', 'bass']
    .map(t => (jingle[t] || []).reduce((s, ev) => s + (Number(ev[1]) || 0), 0));
  const totalBeats = Math.max(...trackLens, 1);

  const events = [];
  ['lead', 'harmony', 'bass'].forEach(tname => {
    let t = 0;
    (jingle[tname] || []).forEach(ev => {
      if (!Array.isArray(ev)) return;
      const [note, beats] = ev;
      const d = Number(beats) || 0;
      if (note && note !== 'rest') {
        const m = String(note).match(/^([A-G][#b]?)(-?\d+)$/);
        if (m) {
          const midi = NOTE_MAP[m[1]] + (parseInt(m[2]) + 1) * 12;
          events.push({ track: tname, t, d, midi });
        }
      }
      t += d;
    });
  });

  if (events.length === 0) return '<div class="piano-roll"><div class="playhead" data-duration="0"></div></div>';

  const midis = events.map(e => e.midi);
  const minMidi = Math.min(...midis) - 1;
  const maxMidi = Math.max(...midis) + 1;
  const range = Math.max(maxMidi - minMidi, 8);
  const innerH = 88;
  const noteH = Math.max(3, Math.floor(innerH / range));

  let html = '<div class="piano-roll">';

  if (Array.isArray(jingle.sections) && jingle.sections.length > 0) {
    jingle.sections.forEach((sec, i) => {
      const start = Number(sec.start) || 0;
      const left = (start / totalBeats) * 100;
      if (i > 0) html += `<div class="section-marker" style="left:${left}%"></div>`;
      html += `<div class="section-label" style="left:${left}%">${escapeHtml(sec.label || '')}</div>`;
    });
  }

  events.forEach(e => {
    const left  = (e.t / totalBeats) * 100;
    const width = Math.max((e.d / totalBeats) * 100 - 0.3, 0.5);
    const top   = ((maxMidi - e.midi) / range) * innerH + 4;
    html += `<div class="note-block ${e.track}" style="left:${left}%;width:${width}%;top:${top}px;height:${noteH}px"></div>`;
  });

  html += `<div class="piano-roll-legend"><span class="lead-l">LEAD</span><span class="harm-l">HARM</span><span class="bass-l">BASS</span></div>`;
  html += `<div class="playhead" data-duration="${totalBeats * beat}"></div></div>`;
  return html;
}

/* =================================================================
   UI RENDERING
   ================================================================= */
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s == null ? '' : String(s);
  return d.innerHTML;
}

function render() {
  avatarAnimations.forEach(a => cancelAnimationFrame(a.raf));
  avatarAnimations.clear();

  const listEl = document.getElementById('guest-list');
  if (guests.length === 0) {
    listEl.innerHTML = `
      <div class="pixel-card empty-state">
        <div class="empty-state-icon">♪ ♫ ♪</div>
        <p>No guests yet. Add one above to compose their arrival theme and pixel avatar.</p>
      </div>
    `;
    return;
  }

  listEl.innerHTML =
    `<h2 class="section-heading">★ GUEST LIST (${guests.length})</h2>` +
    guests.map(g => renderGuestCard(g)).join('');

  mountAvatars();
}

  return `
    <div class="guest-card" data-id="${g.id}">
      <div class="guest-header">
        <div class="guest-left">
          <div style="display:flex;flex-direction:column;gap:0">
            <div class="avatar-wrap" id="avatar-wrap-${g.id}">
              ${avatarInner}
            </div>
            ${aCount > 1 ? `
              <div class="avatar-controls">
                <button data-act="prevAvatar" data-id="${g.id}" ${g.currentAvatarIndex === 0 ? 'disabled' : ''}>◀</button>
                <span>${g.currentAvatarIndex + 1}/${aCount}</span>
                <button data-act="nextAvatar" data-id="${g.id}" ${g.currentAvatarIndex >= aCount - 1 ? 'disabled' : ''}>▶</button>
              </div>
            ` : ''}
          </div>
          <div class="guest-info">
            <div class="guest-name">${escapeHtml(g.name)}</div>
            <div class="guest-theme">"${escapeHtml(jingle.title)}"</div>
            <div class="guest-meta">${escapeHtml(jingle.key)} · ${escapeHtml(jingle.mood)} · ${jingle.tempo} BPM${jingle.form ? ' · ' + escapeHtml(jingle.form) : ''}</div>
            ${g.description ? `<div class="guest-desc">${escapeHtml(g.description)}</div>` : ''}
          </div>
        </div>
        <div class="guest-actions">
          <button class="btn btn-play btn-small" data-act="play" data-id="${g.id}">▶ PLAY</button>
        </div>
      </div>

      ${renderPianoRoll(jingle)}

      <div class="action-row">
        <div class="version-controls">
          <button data-act="prevJingle" data-id="${g.id}" ${g.currentJingleIndex === 0 ? 'disabled' : ''}>◀</button>
          <span>JINGLE ${g.currentJingleIndex + 1} / ${jCount}</span>
          <button data-act="nextJingle" data-id="${g.id}" ${g.currentJingleIndex >= jCount - 1 ? 'disabled' : ''}>▶</button>
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-secondary btn-small" data-act="rerollJingle" data-id="${g.id}">↻ NEW JINGLE</button>
          <button class="btn btn-tertiary btn-small" data-act="rerollAvatar" data-id="${g.id}">↻ NEW AVATAR</button>

          <button class="btn btn-danger btn-small" data-act="delete" data-id="${g.id}">✕</button>
        </div>
      </div>
    </div>
  `;
}

function showError(msg) {

  el.textContent = msg;
  el.style.display = 'block';
}
function hideError() { document.getElementById('form-error').style.display = 'none'; }

function toast(msg, color) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  if (color) t.style.background = color;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2400);
}

async function handleGenerate() {
  const nameEl = document.getElementById('guest-name');
  const descEl = document.getElementById('guest-desc');
  const btn = document.getElementById('generate-btn');
  hideError();

  const name = nameEl.value.trim();
  const description = descEl.value.trim();
  if (!name) return showError('Please enter a name.');
  if (!description) return showError('Describe their vibe — even a sentence works.');

  synth.init();
  btn.disabled = true;
  btn.innerHTML = 'COMPOSING<span class="loading"></span>';

  const [jingleResult, avatarResult] = await Promise.allSettled([
    generateJingle(name, description),
    generateAvatar(name, description)
  ]);

  if (jingleResult.status === 'rejected') {
    btn.disabled = false;
    btn.textContent = '► COMPOSE THEME & AVATAR';
    return showError(`Couldn't compose jingle: ${jingleResult.reason?.message || 'unknown'}`);
  }

  const guest = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,6),
    name,
    description,
    jingles: [jingleResult.value],
    currentJingleIndex: 0,
    avatars: avatarResult.status === 'fulfilled' ? [avatarResult.value] : [],
    currentAvatarIndex: 0
  };
  guests.unshift(guest);
  await saveGuests();

  if (avatarResult.status === 'rejected') {
    showError(`Jingle saved, but avatar failed: ${avatarResult.reason?.message || 'unknown'}. Try "↻ NEW AVATAR".`);
  } else {
    nameEl.value = '';
    descEl.value = '';
  }

  render();
  btn.disabled = false;
  btn.textContent = '► COMPOSE THEME & AVATAR';

  setTimeout(() => synth.play(jingleResult.value, guest.id), 200);
}

async function handleRerollJingle(id) {
  const guest = guests.find(g => g.id === id);
  if (!guest) return;
  const card = document.querySelector(`.guest-card[data-id="${id}"]`);
  const btn = card?.querySelector('[data-act="rerollJingle"]');
  if (btn) { btn.disabled = true; btn.innerHTML = 'REROLLING<span class="loading"></span>'; }

  try {
    const jingle = await generateJingle(guest.name, guest.description);
    guest.jingles.push(jingle);
    guest.currentJingleIndex = guest.jingles.length - 1;
    await saveGuests();
    render();
    setTimeout(() => synth.play(jingle, id), 150);
  } catch (e) {
    showError(`Reroll failed: ${e.message}`);
    if (btn) { btn.disabled = false; btn.innerHTML = '↻ NEW JINGLE'; }
  }
}

async function handleRerollAvatar(id) {
  const guest = guests.find(g => g.id === id);
  if (!guest) return;
  const card = document.querySelector(`.guest-card[data-id="${id}"]`);
  const wrap = card?.querySelector('.avatar-wrap');
  const btn = card?.querySelector('[data-act="rerollAvatar"]');
  if (wrap) wrap.classList.add('loading');
  if (btn) { btn.disabled = true; btn.innerHTML = 'PIXELING<span class="loading"></span>'; }

  try {
    const avatar = await generateAvatar(guest.name, guest.description);
    guest.avatars.push(avatar);
    guest.currentAvatarIndex = guest.avatars.length - 1;
    await saveGuests();
    render();
  } catch (e) {
    showError(`Avatar reroll failed: ${e.message}`);
    if (wrap) wrap.classList.remove('loading');
    if (btn) { btn.disabled = false; btn.innerHTML = '↻ NEW AVATAR'; }
  }
}

async function handleDelete(id) {
  if (synth.currentId === id) synth.stop();
  guests = guests.filter(g => g.id !== id);
  await saveGuests();
  render();
}

function handlePrevJingle(id) {
  const g = guests.find(g => g.id === id);
  if (g && g.currentJingleIndex > 0) { g.currentJingleIndex--; saveGuests(); render(); }
}
function handleNextJingle(id) {
  const g = guests.find(g => g.id === id);
  if (g && g.currentJingleIndex < g.jingles.length - 1) { g.currentJingleIndex++; saveGuests(); render(); }
}
function handlePrevAvatar(id) {
  const g = guests.find(g => g.id === id);
  if (g && g.currentAvatarIndex > 0) { g.currentAvatarIndex--; saveGuests(); render(); }
}
function handleNextAvatar(id) {
  const g = guests.find(g => g.id === id);
  if (g && g.currentAvatarIndex < g.avatars.length - 1) { g.currentAvatarIndex++; saveGuests(); render(); }
}

function sanitizeFilename(s) {
  return String(s).replace(/[^a-z0-9 _-]/gi, '').replace(/\s+/g, '_').slice(0, 60) || 'untitled';
}

function triggerDownload(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { document.body.removeChild(a); URL.revokeObjectURL(url); }, 100);
}

async function handleDownloadWav(id) {
  const guest = guests.find(g => g.id === id);
  if (!guest) return;
  const jingle = guest.jingles[guest.currentJingleIndex];
  const btn = document.querySelector(`.guest-card[data-id="${id}"] [data-act="downloadWav"]`);
  if (btn) { btn.disabled = true; btn.innerHTML = 'RENDERING<span class="loading"></span>'; }
  try {
    const blob = await renderJingleToWav(jingle);
    const fname = `${sanitizeFilename(guest.name)}-${sanitizeFilename(jingle.title)}.wav`;
    triggerDownload(blob, fname);
    toast('WAV DOWNLOADED ♪');
  } catch (e) {
    showError(`WAV render failed: ${e.message}`);
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = '↓ WAV'; }
  }
}

function handleExportBackup() {
  const payload = {
    type: 'eki_greetings_backup',
    version: 2,
    exportedAt: new Date().toISOString(),
    guests
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  triggerDownload(blob, `eki-greetings-backup-${stamp}.json`);
  toast(`BACKUP SAVED (${guests.length} GUESTS) ♪`);
}

function handleImportClick() {
  document.getElementById('import-file').click();
}

async function handleImportFile(e) {
  const file = e.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data || !Array.isArray(data.guests)) throw new Error('Invalid backup file');

    const incoming = data.guests.map(migrateGuest);
    if (guests.length === 0) {
      guests = incoming;
    } else {
      const map = new Map(guests.map(g => [g.id, g]));
      incoming.forEach(g => map.set(g.id, g));
      guests = Array.from(map.values());
    }
    await saveGuests();
    render();
    toast(`IMPORTED ${incoming.length} GUESTS ♪`);
  } catch (err) {
    showError(`Import failed: ${err.message}`);
  } finally {
    e.target.value = '';
  }
}

/* =================================================================
   PLAYHEAD ANIMATION
   ================================================================= */
let playheadAnim = null;
function setPlayingCard(id, isPlaying) {
  document.querySelectorAll('.guest-card.playing').forEach(c => c.classList.remove('playing'));
  document.querySelectorAll('.playhead.active').forEach(p => { p.classList.remove('active'); p.style.left = '0%'; });
  if (playheadAnim) { cancelAnimationFrame(playheadAnim); playheadAnim = null; }
  if (!isPlaying) return;

  const card = document.querySelector(`.guest-card[data-id="${id}"]`);
  if (!card) return;
  card.classList.add('playing');
  const playhead = card.querySelector('.playhead');
  if (!playhead) return;
  const duration = parseFloat(playhead.dataset.duration) * 1000;
  if (!duration || duration <= 0) return;

  playhead.classList.add('active');
  const startedAt = performance.now();
  const tick = (now) => {
    const elapsed = now - startedAt;
    const pct = Math.min(elapsed / duration, 1) * 100;
    playhead.style.left = pct + '%';
    if (elapsed < duration) playheadAnim = requestAnimationFrame(tick);
  };
  playheadAnim = requestAnimationFrame(tick);
}

synth.onStart = (id) => setPlayingCard(id, true);
synth.onEnd   = (id) => setPlayingCard(id, false);

/* =================================================================
   WIRE UP
   ================================================================= */
document.getElementById('generate-btn').addEventListener('click', handleGenerate);
document.getElementById('export-btn').addEventListener('click', handleExportBackup);
document.getElementById('import-btn').addEventListener('click', handleImportClick);
document.getElementById('import-file').addEventListener('change', handleImportFile);

document.getElementById('guest-list').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const id = btn.dataset.id;
  const act = btn.dataset.act;
  const guest = guests.find(g => g.id === id);
  if (!guest) return;
  switch (act) {
    case 'play':           synth.play(guest.jingles[guest.currentJingleIndex], id); break;
    case 'rerollJingle':   handleRerollJingle(id); break;
    case 'rerollAvatar':   handleRerollAvatar(id); break;
    case 'downloadWav':    handleDownloadWav(id); break;
    case 'delete':         handleDelete(id); break;
    case 'prevJingle':     handlePrevJingle(id); break;
    case 'nextJingle':     handleNextJingle(id); break;
    case 'prevAvatar':     handlePrevAvatar(id); break;
    case 'nextAvatar':     handleNextAvatar(id); break;
  }
});

document.getElementById('guest-desc').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) handleGenerate();
});

loadGuests();
</script>
