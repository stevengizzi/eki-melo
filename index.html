<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EKI GREETINGS — Birthday Party Jingles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">
  <header>
    <h1>EKI GREETINGS</h1>
    <p class="subtitle">A <span class="hl">birthday-party arrival theme</span> generator <span class="heart">♥</span> Inspired by Japanese train-station <em>eki melodies</em>, rendered NES-style with pixel avatars.</p>
    <div class="backup-bar">
      <button class="btn btn-ghost btn-small" id="export-btn">↓ EXPORT BACKUP</button>
      <button class="btn btn-ghost btn-small" id="import-btn">↑ IMPORT BACKUP</button>
      <input type="file" id="import-file" accept="application/json" style="display:none">
    </div>
  </header>

  <div class="pixel-card form-section">
    <h2>＋ ADD A GUEST</h2>
    <label for="guest-name">GUEST NAME</label>
    <input type="text" id="guest-name" placeholder="e.g. Patrick" maxlength="60" autocomplete="off">
    <label for="guest-desc">PERSONALITY / VIBE</label>
    <textarea id="guest-desc" placeholder="e.g. Mellow and dreamy, loves shoegaze and houseplants. Walks slowly, talks even slower. Always brings the perfect record." maxlength="500"></textarea>
    <span class="field-label">ENGINE</span>
    <div class="engine-select" id="engine-select">
      <label class="engine-option">
        <input type="radio" name="engine" value="pipeline" checked>
        <span class="engine-option-text">PIPELINE <small>new · 10-stage composer</small></span>
      </label>
      <label class="engine-option">
        <input type="radio" name="engine" value="v1">
        <span class="engine-option-text">v1 <small>classic · the loose original</small></span>
      </label>
    </div>
    <button class="btn" id="generate-btn">► COMPOSE THEME &amp; AVATAR</button>
    <div id="form-error" class="error" style="display:none"></div>
    <div id="form-retry" class="form-retry" style="display:none"></div>
  </div>

  <div id="guest-list"></div>

  <footer>
    <p class="tag">▶ PRESS START TO CONTINUE ◀</p>
    <p>Multi-section forms · three voices · animated pixel avatars <span class="coin"></span> Made for a real birthday.</p>
  </footer>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
